<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Admission</title>
</head>
<body>
    <h1>College Admission Form</h1>
    <form>
        <div>
            <h3>Personal Details</h3>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="Full name" placeholder="Enter your name" required><br>

            <label for="dob">Date Of Birth:</label>
            <input type="date" id="dob" name="DOB" required><br>

            <label>Gender:</label>

            <input type="radio" id="male" name="Gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="Gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="Gender" value="other">
            <label for="other">Other</label>
            <br>


            <label for="email">Email:</label>
            <input type="email" id="email" name="Email" placeholder="Enter your email" required><br>

            <label for="number">Phone Number:</label>
            <input type="tel" id="number" name="Number" placeholder="Enter your number">

        </div>

        <div>
            <h3>Address Details</h3>
            
            <label for="address">Address:</label>
            <input type="text" id="address" name="Address" required>
            <br>

            <label for="city">City:</label>
            <input type="text" id="city" name="City" required>
            <br>

            <label for="state">State:</label>
            <input type="text" id="state" name="State" required>
            <br>

            <label for="pincode">Pin Code:</label>
            <input type="text" id="pincode" name="Pin Code" required>

            <h3>Academic Details</h3>

            <label for="percentage">12th Percentage:</label>
            <input type="number" id="percentage" name="12th percentage" min="0" max="100" required>
            <br>

            <label for="boards">Boards:</label>
            <input type="text" id="boards" name="Boards" required>
            <br>

            <label for="year">Passing Year:</label>
            <input type="number" id="year" name="Passing Year" required>


            <h3>Course Selection</h3>

            <label for="courses">Select Course:</label>

            <select id="course" name="course" required>
                <option value="" disabled selected>--Select a Course--</option>
                <option value="btech">B.Tech</option>
                <option value="bsc">B.Sc</option>
                <option value="bca">BCA</option>
                <option value="bba">BBA</option>
            </select>

           
            <h3>Category</h3>

            <label for="category">Select Category:</label>

            <select id="category" name="Category" required>
                <option value="" disabled selected>--Select Category--</option>
                <option value="general">General</option>
                <option value="obc">OBC</option>
                <option value="sc">SC</option>
                <option value="st">ST</option>
            </select>
            

            <h3>Documents</h3>

            <label for="marksheet">Upload 12th Marksheet</label>
            <input type="file" id="marksheet" name="Marksheet" required>


            <h3>Decleration</h3>
            
            <input type="checkbox" id="decleration" name="decleration" required>
            <label for="decleration">I declare that the information provided by me is correct.</label>
            <br>
            <br>
            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>
            <br>
            <br>

            
            <a href="index.html">Back To Home</a>

            <h4>Created with &#10084 by me</h4>



        </div>

        

    </form>
    
</body>
</html>
